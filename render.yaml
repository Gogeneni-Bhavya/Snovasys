services:
  - type: web
    name: ledgerline
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: ledgerline-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/ledgerline.sqlite
      - key: SEED_DEMO
        value: "false"
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: ledger-admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
